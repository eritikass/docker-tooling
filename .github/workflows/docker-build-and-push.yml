---
name: 'Docker build and push'

on:
  workflow_dispatch:
  push:
    branches: [master, '*']

jobs:
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - run: uname -m
  
      - name: Test nginx-dir-listing image (nginx.config)
        run: |
          set -xe
          cd ./nginx-dir-listing
          docker build -t nginx-dir-listing .
          docker run --rm nginx-dir-listing node --version
          echo "test-me-123" > /tmp/test-me-123.txt
          mkdir -p /tmp/foo_booo
          echo "<aa></aa>" > /tmp/foo_booo/testing-data-file.xml
          docker run --rm -d -p 80:80 -v "/tmp/test-me-123.txt:/usr/share/nginx/html/test-me-123.txt" -v "/tmp/:/usr/share/nginx/html/_tmp" nginx-dir-listing
          docker images
          sleep 5

          curl -v -f http://localhost:80/test-me-123.txt || exit 1
          output_test_me_123_txt=$(curl -s http://localhost:80/test-me-123.txt) 
          if [[ "$output_test_me_123_txt" != "test-me-123" ]]; then
            echo -e "\nTest failed(test-me-123.txt): $output_test_me_123_txt"
            exit 1
          fi
          echo -e "\nTest passed(test-me-123.txt): '$output_test_me_123_txt'"

          # test listing works (HTML)
          curl -v -f http://localhost:80/ || exit 1
          output_dir_listing_html=$(curl -s http://localhost:80/)
          if [[ "$output_dir_listing_html" != *"test-me"* ]]; then
            echo -e "\nTest failed(dir-listing-html): $output_dir_listing_html"
            exit 1
          fi
          echo -e "\nTest passed(dir-listing-html): '$output_dir_listing_html'"

          # test listing works (API, json)
          curl -v -f http://localhost:80/___api/listing?path= || exit 1
          curl -v -f http://localhost:80/___api/listing?path=_tmp || exit 1
          curl -v -f http://localhost:80/___api/listing?path=_tmp/foo_booo || exit 1
          output_dir_listing_json=$(curl -s http://localhost:80/___api/listing?path=_tmp/foo_booo)
          echo "$output_dir_listing_json" | jq

          if [[ "$output_dir_listing_json" != *"testing-data-file.xml"* ]]; then
            echo -e "\nTest failed(dir-listing-api-json)[listed]: $output_dir_listing_json"
            exit 1
          fi
          echo -e "\nTest passed(dir-listing-api-json)[listed]: '$output_dir_listing_json'"

          # check .files["testing-data-file.xml"].isDirectory = false
          testingDataFileXml=$(echo "$output_dir_listing_json" | jq -r '.files["testing-data-file.xml"]')
          echo "$testingDataFileXml" | jq
          testingDataFileXmlIsDirectory=$(echo "$testingDataFileXml" | jq -r '.isDirectory')
          # test if .isDirectory is false
          if [[ "$testingDataFileXmlIsDirectory" != "false" ]]; then
            echo -e "\nTest failed(dir-listing-api-json)[isDirectory]: $testingDataFileXmlIsDirectory"
            exit 1
          fi
          echo -e "\nTest passed(dir-listing-api-json)[isDirectory]: '$testingDataFileXmlIsDirectory'"


          # test listing works (API w.depth, json)
          curl -v -f 'http://localhost:80/___api/listing?path=.&depth=4' || exit 1
          output_dir_listing_json_depth=$(curl -s 'http://localhost:80/___api/listing?path=.&depth=4')
          echo "$output_dir_listing_json_depth" | jq

          if [[ "$output_dir_listing_json_depth" != *"testing-data-file.xml"* ]]; then
            echo -e "\nTest failed(dir-listing-api-json)[listed.w.depth]: $output_dir_listing_json_depth"
            exit 1
          fi
          echo -e "\nTest passed(dir-listing-api-json)[listed.w.depth]: '$output_dir_listing_json_depth'"

          # openspeedtest upload handler
          curl -v http://localhost:80/openspeedtest/upload
          curl -f http://localhost:80/openspeedtest/upload || exit 1

          docker ps -a 

      - name: Test tooling image

        run: |
          set -xe
          cd ./tooling
          docker build -t tooling-image .
          docker images
          # run some test commands
          docker run --rm tooling-image date
          docker run --rm tooling-image sh -c 'uname -m'
          docker run --rm tooling-image bash -c 'gojq --version'
          docker run --rm tooling-image yq_v4 --version


  tooling_docker_build_and_push:
    needs: test_job
    # https://github.com/sdr-enthusiasts/common-github-workflows/blob/main/.github/workflows/build_and_push_image.yml
    uses: sdr-enthusiasts/common-github-workflows/.github/workflows/build_and_push_image.yml@main
    with:
      docker_build_context: "tooling"
      docker_build_file: "tooling/Dockerfile"
      docker_latest_tag: "tooling"
      #
      # SHARED SETTINGS
      #
      push_enabled: true
      # push_destinations: ghcr.io;dockerhub
      push_destinations: dockerhub
      # ghcr_repo_owner: ${{ github.repository_owner }}
      # ghcr_repo: ${{ github.repository }}
      dockerhub_profile: eritikass
      dockerhub_repo: tooling
      get_version_method: git_commit_hash_short
      platform_linux_arm32v6_enabled: false
      platform_linux_arm32v7_enabled: false
      platform_linux_arm64v8_enabled: true
      platform_linux_amd64_enabled: true
      platform_linux_i386_enabled: false
    secrets:
      # ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}


  nginx_dir_listing_docker_build_and_push:
    needs: test_job
    # https://github.com/sdr-enthusiasts/common-github-workflows/blob/main/.github/workflows/build_and_push_image.yml
    uses: sdr-enthusiasts/common-github-workflows/.github/workflows/build_and_push_image.yml@main
    with:
      docker_build_context: "nginx-dir-listing"
      docker_build_file: "nginx-dir-listing/Dockerfile"
      docker_latest_tag: "nginx-dir-listing"
      #
      # SHARED SETTINGS
      #
      push_enabled: true
      # push_destinations: ghcr.io;dockerhub
      push_destinations: dockerhub
      # ghcr_repo_owner: ${{ github.repository_owner }}
      # ghcr_repo: ${{ github.repository }}
      dockerhub_profile: eritikass
      dockerhub_repo: tooling
      get_version_method: git_commit_hash_short
      platform_linux_arm32v6_enabled: false
      platform_linux_arm32v7_enabled: false
      platform_linux_arm64v8_enabled: true
      platform_linux_amd64_enabled: true
      platform_linux_i386_enabled: false
    secrets:
      # ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
