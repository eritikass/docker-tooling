

server {                                                      
    listen       80;                                                             
    listen  [::]:80;                                                             
    server_name  localhost;                                                      

    index index.html;
    client_max_body_size 35m;
    error_page 405 =200 $uri;
    access_log off;
    gzip off; 
    fastcgi_read_timeout 999;
    log_not_found off;
    server_tokens off;
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;    

    #access_log  /var/log/nginx/host.access.log  main;                           
                                                                                 
    location / {                                                                 
        root   /usr/share/nginx/html;  

        # 
        # ENABLE FOLDER LISTING
        #
        autoindex on;

        add_header 'Access-Control-Allow-Origin' "*" always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        #Very Very Important! You SHOULD send no-store from server for Google Chrome.
        add_header Cache-Control 'no-store, no-cache, max-age=0, no-transform';
        add_header Last-Modified $date_gmt;
        if_modified_since off;
        expires off;
        etag off;

        if ($request_method = OPTIONS ) {
            add_header 'Access-Control-Allow-Credentials' "true";
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;        
            add_header 'Access-Control-Allow-Methods' "GET, POST, OPTIONS" always;
            return 200;
        }
    }

    location = /___api/listing {
        content_by_lua_block {
            -- Get the query string
            local query = ngx.var.query_string or "" -- Default to an empty string if nil

            -- Escape the query string to prevent shell interpretation issues
            local escaped_query = string.gsub(query, '"', '\\"') -- Escape double quotes

            -- Construct the command to send to the Node.js process
            local node_command = 'node /node-js/listing.mjs "' .. escaped_query .. '"'
            
            -- Execute the Node.js process and capture its output
            local handle = io.popen(node_command)
            local result = handle:read("*a")
            handle:close()

            -- Return the result to the client
            if result then
                ngx.status = 200
                ngx.header.content_type = "text/json"
                ngx.say(result)
            else
                ngx.status = 500
                ngx.header.content_type = "text/plain"
                ngx.say("Error executing Node.js process")
            end
        }
    }

    # https://github.com/openspeedtest/Docker-Image/blob/fc86f9f4bd240fec5eb7670836e37252527afab7/files/OpenSpeedTest-Server.conf#L77-L82
    location = /openspeedtest/upload {
        proxy_pass http://127.0.0.1:80/openspeedtest/dev-null;
    }
    location = /openspeedtest/dev-null {
        return 200;
    }


    # deny access to .htaccess files, if Apache's document root                  
    # concurs with nginx's one                                                   
    #                                                                            
    #location ~ /\.ht {                                                          
    #    deny  all;                                                              
    #}                                                                           
} 
